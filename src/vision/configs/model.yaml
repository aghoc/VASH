base_model: models/pretrained/yolo26s.pt
image_size: 640
epochs: 50
batch: 16
workers: 8
device: 0
amp: false
seed: 42
deterministic: true
optimizer: AdamW
lr0: 0.001
weight_decay: 0.0005
augment:
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.4
  degrees: 8.0
  translate: 0.1
  scale: 0.5
  fliplr: 0.5
  mosaic: 0.7
  mixup: 0.1
